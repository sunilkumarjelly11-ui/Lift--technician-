<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lift Technician</title>

<style>
*{
  box-sizing:border-box;
    font-family:Arial,sans-serif;
    }

    body{
      margin:0;
        background:#eef3f8;
          color:#062542;
          }

          .screen{
            display:none;
              min-height:100vh;
                padding:25px;
                }

                .active{
                  display:block;
                  }

                  .login{
                    max-width:500px;
                      margin:80px auto;
                        background:white;
                          padding:35px;
                            border-radius:25px;
                              box-shadow:0 10px 30px #0002;
                                text-align:center;
                                }

                                h1{
                                  margin-bottom:10px;
                                  }

                                  .logo{
                                    font-size:60px;
                                    }

                                    input{
                                      width:100%;
                                        padding:16px;
                                          margin:10px 0;
                                            border:1px solid #ddd;
                                              border-radius:12px;
                                                font-size:16px;
                                                }

                                                button{
                                                  width:100%;
                                                    padding:16px;
                                                      margin-top:10px;
                                                        border:0;
                                                          border-radius:12px;
                                                            background:#1478e8;
                                                              color:white;
                                                                font-size:17px;
                                                                  font-weight:bold;
                                                                  }

                                                                  .card{
                                                                    background:white;
                                                                      padding:20px;
                                                                        margin:15px 0;
                                                                          border-radius:18px;
                                                                            box-shadow:0 5px 15px #0001;
                                                                            }

                                                                            .logout{
                                                                              background:#e53935;
                                                                              }

                                                                              </style>
                                                                              </head>

                                                                              <body>

                                                                              <!-- LOGIN -->
                                                                              <section id="loginScreen" class="screen active">

                                                                              <div class="login">

                                                                              <div class="logo">🛗</div>

                                                                              <h1>Lift Technician</h1>

                                                                              <p>JSK Elevators</p>

                                                                              <input id="technician" type="text"
                                                                              placeholder="Technician Name">

                                                                              <input id="pin" type="password"
                                                                              placeholder="PIN">

                                                                              <button onclick="login()">LOGIN</button>

                                                                              <p id="message"></p>

                                                                              </div>

                                                                              </section>


                                                                              <!-- DASHBOARD -->
                                                                              <section id="dashboardScreen" class="screen">

                                                                              <h1>Technician Dashboard</h1>

                                                                              <p>Welcome, <b id="welcomeName"></b></p>

                                                                              <div class="card">
                                                                              <h2>🛗 Lift Details</h2>
                                                                              <p>Enter and manage lift information.</p>
                                                                              <button onclick="showLift()">Open Lift Details</button>
                                                                              </div>

                                                                              <div class="card">
                                                                              <h2>🔧 Breakdown Report</h2>
                                                                              <p>Report lift breakdown problems.</p>
                                                                              <button onclick="alert('Breakdown Report coming next')">
                                                                              Create Report
                                                                              </button>
                                                                              </div>

                                                                              <div class="card">
                                                                              <h2>✅ Maintenance</h2>
                                                                              <p>Maintenance checklist.</p>
                                                                              <button onclick="alert('Maintenance Checklist coming next')">
                                                                              Open Checklist
                                                                              </button>
                                                                              </div>

                                                                              <div class="card">
                                                                              <h2>📍 GPS Location</h2>
                                                                              <button onclick="getLocation()">Get Location</button>
                                                                              <p id="location"></p>
                                                                              </div>

                                                                              <button class="logout" onclick="logout()">LOGOUT</button>

                                                                              </section>


                                                                              <!-- LIFT DETAILS -->
                                                                              <section id="liftScreen" class="screen">

                                                                              <h1>🛗 Lift Details</h1>

                                                                              <div class="card">

                                                                              <input id="liftNumber"
                                                                              placeholder="Lift Number">

                                                                              <input id="customer"
                                                                              placeholder="Customer Name">

                                                                              <input id="locationName"
                                                                              placeholder="Lift Location">

                                                                              <button onclick="saveLift()">SAVE LIFT</button>

                                                                              <button onclick="backDashboard()">BACK</button>

                                                                              </div>

                                                                              </section>


                                                                              <script>

                                                                              function login(){

                                                                              const name =
                                                                              document.getElementById("technician").value.trim();

                                                                              const pin =
                                                                              document.getElementById("pin").value.trim();

                                                                              if(name === ""){
                                                                              alert("Please enter Technician Name");
                                                                              return;
                                                                              }

                                                                              if(pin === ""){
                                                                              alert("Please enter PIN");
                                                                              return;
                                                                              }

                                                                              document.getElementById("welcomeName").textContent=name;

                                                                              document.getElementById("loginScreen")
                                                                              .classList.remove("active");

                                                                              document.getElementById("dashboardScreen")
                                                                              .classList.add("active");

                                                                              }

                                                                              function logout(){

                                                                              document.getElementById("dashboardScreen")
                                                                              .classList.remove("active");

                                                                              document.getElementById("liftScreen")
                                                                              .classList.remove("active");

                                                                              document.getElementById("loginScreen")
                                                                              .classList.add("active");

                                                                              document.getElementById("technician").value="";
                                                                              document.getElementById("pin").value="";

                                                                              }

                                                                              function showLift(){

                                                                              document.getElementById("dashboardScreen")
                                                                              .classList.remove("active");

                                                                              document.getElementById("liftScreen")
                                                                              .classList.add("active");

                                                                              }

                                                                              function backDashboard(){

                                                                              document.getElementById("liftScreen")
                                                                              .classList.remove("active");

                                                                              document.getElementById("dashboardScreen")
                                                                              .classList.add("active");

                                                                              }

                                                                              function saveLift(){

                                                                              alert("Lift details saved successfully!");

                                                                              }

                                                                              function getLocation(){

                                                                              if(!navigator.geolocation){

                                                                              alert("GPS is not supported");

                                                                              return;

                                                                              }

                                                                              navigator.geolocation.getCurrentPosition(

                                                                              function(position){

                                                                              document.getElementById("location").textContent =
                                                                              "Latitude: " +
                                                                              position.coords.latitude +
                                                                              " | Longitude: " +
                                                                              position.coords.longitude;

                                                                              },

                                                                              function(){

                                                                              alert("Unable to get GPS location");

                                                                              }

                                                                              );

                                                                              }

                                                                              </script>

                                                                              </body>
                                                                              </html>
