<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#062542">
<title>Lift Technician</title>

<style>
* {
  box-sizing: border-box;
  }

  body {
    margin: 0;
      font-family: Arial, sans-serif;
        background: #eef3f8;
          color: #062542;
          }

          header {
            background: #062542;
              color: white;
                padding: 18px;
                  text-align: center;
                  }

                  header h1 {
                    margin: 0;
                      font-size: 24px;
                      }

                      .container {
                        max-width: 600px;
                          margin: auto;
                            padding: 18px;
                            }

                            .screen {
                              display: none;
                              }

                              .screen.active {
                                display: block;
                                }

                                .card {
                                  background: white;
                                    padding: 20px;
                                      margin: 15px 0;
                                        border-radius: 16px;
                                          box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                                          }

                                          h2 {
                                            margin-top: 5px;
                                            }

                                            label {
                                              display: block;
                                                margin-top: 14px;
                                                  font-weight: bold;
                                                  }

                                                  input,
                                                  select,
                                                  textarea {
                                                    width: 100%;
                                                      padding: 13px;
                                                        margin-top: 7px;
                                                          border: 1px solid #ccd5df;
                                                            border-radius: 10px;
                                                              font-size: 16px;
                                                              }

                                                              textarea {
                                                                min-height: 110px;
                                                                  resize: vertical;
                                                                  }

                                                                  button {
                                                                    width: 100%;
                                                                      padding: 14px;
                                                                        margin-top: 15px;
                                                                          border: none;
                                                                            border-radius: 10px;
                                                                              background: #062542;
                                                                                color: white;
                                                                                  font-size: 16px;
                                                                                    font-weight: bold;
                                                                                    }

                                                                                    button.secondary {
                                                                                      background: #607d8b;
                                                                                      }

                                                                                      button.success {
                                                                                        background: #16834b;
                                                                                        }

                                                                                        .menu {
                                                                                          display: grid;
                                                                                            grid-template-columns: 1fr 1fr;
                                                                                              gap: 12px;
                                                                                              }

                                                                                              .menu button {
                                                                                                min-height: 90px;
                                                                                                }

                                                                                                .status {
                                                                                                  padding: 12px;
                                                                                                    background: #e8f5e9;
                                                                                                      color: #176b35;
                                                                                                        border-radius: 10px;
                                                                                                          margin-top: 12px;
                                                                                                          }

                                                                                                          .check {
                                                                                                            display: flex;
                                                                                                              align-items: center;
                                                                                                                gap: 10px;
                                                                                                                  padding: 10px 0;
                                                                                                                    border-bottom: 1px solid #eee;
                                                                                                                    }

                                                                                                                    .check input {
                                                                                                                      width: 20px;
                                                                                                                        height: 20px;
                                                                                                                          margin: 0;
                                                                                                                          }

                                                                                                                          .small {
                                                                                                                            font-size: 13px;
                                                                                                                              color: #607d8b;
                                                                                                                                text-align: center;
                                                                                                                                  margin-top: 20px;
                                                                                                                                  }
                                                                                                                                  </style>
                                                                                                                                  </head>

                                                                                                                                  <body>

                                                                                                                                  <header>
                                                                                                                                    <h1>🛗 Lift Technician</h1>
                                                                                                                                    </header>

                                                                                                                                    <div class="container">

                                                                                                                                    <!-- LOGIN -->
                                                                                                                                    <section id="loginScreen" class="screen active">
                                                                                                                                      <div class="card">
                                                                                                                                          <h2>Technician Login</h2>

                                                                                                                                              <label>Technician Name</label>
                                                                                                                                                  <input id="technician" type="text" placeholder="Enter technician name">

                                                                                                                                                      <label>PIN</label>
                                                                                                                                                          <input id="pin" type="password" placeholder="Enter PIN">

                                                                                                                                                              <button onclick="login()">LOGIN</button>

                                                                                                                                                                  <p class="small">Lift Technician App</p>
                                                                                                                                                                    </div>
                                                                                                                                                                    </section>


                                                                                                                                                                    <!-- DASHBOARD -->
                                                                                                                                                                    <section id="dashboardScreen" class="screen">
                                                                                                                                                                      <div class="card">
                                                                                                                                                                          <h2>Dashboard</h2>
                                                                                                                                                                              <p>Welcome, <strong id="welcomeName"></strong></p>

                                                                                                                                                                                  <div class="menu">

                                                                                                                                                                                      <button onclick="showScreen('liftScreen')">
                                                                                                                                                                                          🔼<br>Lift Details
                                                                                                                                                                                            </button>

                                                                                                                                                                                              <button onclick="showScreen('breakdownScreen')">
                                                                                                                                                                                                  🚨<br>Breakdown Report
                                                                                                                                                                                                    </button>

                                                                                                                                                                                                      <button onclick="showScreen('checklistScreen')">
                                                                                                                                                                                                          🔧<br>Maintenance Checklist
                                                                                                                                                                                                            </button>

                                                                                                                                                                                                            </div>the
                                                                                                                                                                                        
                                                                                                                                                                                                
                                                                                                                                                                                                      

                                                                                                                                                                                                        
                                                                                                                                                                                                                    
                                                                                                                                                                                                                          

                                                                                                                                                                                                                                
                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                              

                                                                                                                                                                                                                                                    <button onclick="getLocation()">
                                                                                                                                                                                                                                                            📍<br>GPS Location
                                                                                                                                                                                                                                                                  </button>
                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                          <div id="locationStatus" class="status">
                                                                                                                                                                                                                                                                                GPS location not captured.
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                        <button class="secondary" onclick="logout()">LOGOUT</button>
                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                          </section>


                                                                                                                                                                                                                                                                                          <!-- LIFT DETAILS -->
                                                                                                                                                                                                                                                                                          <section id="liftScreen" class="screen">
                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                <h2>🛗 Lift Details</h2>

                                                                                                                                                                                                                                                                                                    <label>Customer / Building Name</label>
                                                                                                                                                                                                                                                                                                        <input id="customerName" type="text" placeholder="Customer Name">

                                                                                                                                                                                                                                                                                                            <label>Lift Number</label>
                                                                                                                                                                                                                                                                                                                <input id="liftNumber" type="text" placeholder="Lift Number">

                                                                                                                                                                                                                                                                                                                    <label>Location</label>
                                                                                                                                                                                                                                                                                                                        <input id="liftLocation" type="text" placeholder="Lift Location">

                                                                                                                                                                                                                                                                                                                            <label>Lift Type</label>
                                                                                                                                                                                                                                                                                                                                <select id="liftType">
                                                                                                                                                                                                                                                                                                                                      <option>Passenger Lift</option>
                                                                                                                                                                                                                                                                                                                                            <option>Goods Lift</option>
                                                                                                                                                                                                                                                                                                                                                  <option>Hospital Lift</option>
                                                                                                                                                                                                                                                                                                                                                        <option>Home Lift</option>
                                                                                                                                                                                                                                                                                                                                                              <option>Other</option>
                                                                                                                                                                                                                                                                                                                                                                  </select>

                                                                                                                                                                                                                                                                                                                                                                      <button class="success" onclick="saveLift()">
                                                                                                                                                                                                                                                                                                                                                                            SAVE LIFT
                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                    <button class="secondary" onclick="backDashboard()">
                                                                                                                                                                                                                                                                                                                                                                                          BACK
                                                                                                                                                                                                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                </section>


                                                                                                                                                                                                                                                                                                                                                                                                <!-- BREAKDOWN -->
                                                                                                                                                                                                                                                                                                                                                                                                <section id="breakdownScreen" class="screen">
                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                      <h2>⚠️ Breakdown Report</h2>

                                                                                                                                                                                                                                                                                                                                                                                                          <label>Lift Number</label>
                                                                                                                                                                                                                                                                                                                                                                                                              <input id="breakdownLift" type="text" placeholder="Lift Number">

                                                                                                                                                                                                                                                                                                                                                                                                                  <label>Breakdown Type</label>
                                                                                                                                                                                                                                                                                                                                                                                                                      <select id="breakdownType">
                                                                                                                                                                                                                                                                                                                                                                                                                            <option>Select Breakdown Type</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                  <option>Lift Not Moving</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <option>Door Problem</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                              <option>Lift Stuck</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <option>Noise / Vibration</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                          <option>Electrical Problem</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                <option>Other</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Describe the Problem</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <textarea id="breakdownProblem"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  placeholder="Describe the problem..."></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="success" onclick="saveBreakdown()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            SAVE BREAKDOWN
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="secondary" onclick="backDashboard()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          BACK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- MAINTENANCE CHECKLIST -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <section id="checklistScreen" class="screen">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h2>☑️ Maintenance Checklist</h2>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="checkbox" id="c1">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label for="c1">Machine Room Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="checkbox" id="c2">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label for="c2">Lift Door Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="checkbox" id="c3">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <label for="c3">Door Lock Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="checkbox" id="c4">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label for="c4">Safety Circuit Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="checkbox" id="c5">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label for="c5">Emergency Alarm Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="checkbox" id="c6">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <label for="c6">Car Light Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <input type="checkbox" id="c7">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="c7">Safety Circuit Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <input type="checkbox" id="c8">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label for="c8">Door Lock Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <input type="checkbox" id="c9">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label for="c9">Door Sensor Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <input type="checkbox" id="c10">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="c10">Emergency Alarm Checked</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="check">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <input type="checkbox" id="c11">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="c11">Inspection Completed</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </section>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function showScreen(screenId) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.querySelectorAll('.screen').forEach(function(screen) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    screen.classList.remove('active');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const screen = document.getElementById(screenId);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (screen) {
