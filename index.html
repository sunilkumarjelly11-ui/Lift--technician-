<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSK Elevators Dashboard</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 0; }
        header { background-color: #1a365d; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; transition: 0.2s; }
        .card:hover { background: #edf2f7; border-color: #cbd5e0; }
        .card h3 { margin: 10px 0 0 0; color: #2d3748; font-size: 16px; }
        .card-icon { font-size: 24px; }
        .section-title { color: #2d3748; font-size: 20px; font-weight: bold; margin-bottom: 10px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .welcome { color: #718096; font-size: 14px; margin-bottom: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; }
        .error-box { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .success-box { background: #f0fff4; color: #276749; border: 1px solid #9ae6b4; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>JSK ELEVATORS</header>

    <!-- Login Screen -->
    <div id="login-screen" class="container">
        <h2 class="section-title">Login</h2>
        <input type="text" id="email" placeholder="Email (e.g., sunilkumarjelly11@gmail.com)">
        <input type="text" id="password" placeholder="Password" type="password">
        <button onclick="login()" style="width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">Sign In</button>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="container hidden">
        <h2 class="section-title">JSK ELEVATORS Dashboard</h2>
        
        <div class="grid">
            <div class="card" onclick="selectCategory('apartments')">
                <div class="card-icon">🏢</div>
                <h3>Apartments</h3>
            </div>
            <div class="card" onclick="selectCategory('controls')">
                <div class="card-icon">🎛️</div>
                <h3>Controls</h3>
            </div>
            <div class="card" onclick="selectCategory('manuals')">
                <div class="card-icon">📘</div>
                <h3>Manuals</h3>
            </div>
            <div class="card" onclick="selectCategory('motors')">
                <div class="card-icon">⚙️</div>
                <h3>Motors</h3>
            </div>
        </div>

        <h2 class="section-title">Apartments</h2>
        <div class="welcome">Welcome, <strong id="user-email-display"></strong></div>
        
        <!-- Error/Success Messages -->
        <div id="error-msg" class="error-box"></div>
        <div id="success-msg" class="success-box"></div>

        <!-- Search -->
        <input type="text" id="search-input" placeholder="Search apartment name..." onkeyup="searchAssets()">

        <!-- Dynamic Content Area -->
        <div id="assets-list">
            <p style="color: #a0aec0; text-align: center;">No assets found yet. Upload one below.</p>
        </div>

        <!-- Upload Form (For Demo, using basic file input) -->
        <div style="margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <h3 style="color: #2d3748; margin-bottom: 10px;">Upload New Asset</h3>
            <input type="text" id="apt-name-input" placeholder="Apartment Name">
            <select id="category-input" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e0; margin-bottom: 15px;">
                <option value="controls">Controls</option>
                <option value="manuals">Manuals</option>
                <option value="motors">Motors</option>
                <option value="gallery">Gallery</option>
                <option value="camera">Camera</option>
                <option value="video">Video</option>
            </select>
            <input type="file" id="file-input" style="margin-bottom: 15px;">
            <button onclick="uploadAsset()" style="width: 100%; padding: 12px; background: #38a169; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer;">Upload</button>
        </div>
    </div>

    <script>
        // 1. Initialize Supabase (REPLACE WITH YOUR ACTUAL SUPABASE URL AND ANON KEY)
        const SUPABASE_URL = 'sb_publishable_wKQWg06T6Qiuv7uN5VJ4Kg_vJtl0x7H';
        const SUPABASE_ANON_KEY = 'your-anon-key';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUserEmail = 'sunilkumarjelly11@gmail.com';

        // 2. Login Function
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // For demo purposes, we bypass actual auth if you don't have passwords set up yet.
            // In production, use: const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            currentUserEmail = email;
            document.getElementById('user-email-display').innerText = email;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            
            // Fetch data after login
            fetchAssets();
        }

        // 3. Fetch Assets with SAFE NULL CHECKS
        async function fetchAssets() {
            const { data, error } = await supabase
                .from('apartment_assets')
                .select('*')
                .eq('technician', currentUserEmail)
                .order('created_at', { ascending: false });

            if (error) {
                showError("Failed to load data: " + error.message);
                return;
            }

            renderAssets(data);
        }

        // 4. Render Assets (Prevents the "latitude" crash)
        function renderAssets(assets) {
            const list = document.getElementById('assets-list');
            list.innerHTML = '';

            if (!assets || assets.length === 0) {
                list.innerHTML = '<p style="color: #a0aec0; text-align: center;">No assets found. Upload one above.</p>';
                return;
            }

            assets.forEach(asset => {
                // SAFE ACCESS: Using optional chaining (?.) to prevent "Cannot read properties of null"
                const title = asset?.title || 'Untitled';
                const aptName = asset?.apartment_name || 'Unknown Apartment';
                const category = asset?.category || 'N/A';
                const urls = asset?.media_urls || [];

                // Safely handle media URLs
                let mediaHTML = '';
                if (urls.length > 0 && urls[0]) {
                    mediaHTML = `<a href="${urls[0]}" target="_blank" style="color: #3182ce; font-size: 14px;">📎 View Attachment</a>`;
                }

                const div = document.createElement('div');
                div.style.cssText = 'border: 1px solid #e2e8f0; padding: 15px; border-radius: 8px; margin-bottom: 10px; background: #fff;';
                div.innerHTML = `
                    <h4 style="margin: 0 0 5px 0; color: #2d3748;">${aptName} - ${category.toUpperCase()}</h4>
                    <p style="margin: 0; color: #718096; font-size: 14px;">${title}</p>
                    ${mediaHTML}
                `;
                list.appendChild(div);
            });
        }

        // 5. Upload Asset
        async function uploadAsset() {
            const aptName = document.getElementById('apt-name-input').value;
            const category = document.getElementById('category-input').value;
            const fileInput = document.getElementById('file-input');
            const file = fileInput.files[0];

            if (!aptName) {
                showError("Please enter an apartment name.");
                return;
            }

            let fileUrl = '';
            if (file) {
                // SAFE FOLDER NAME: Replaces special chars (like @) to match database policy
                const safeFolderName = currentUserEmail.replace(/[^a-zA-Z0-9_-]/g, '_');
                const filePath = `${safeFolderName}/${Date.now()}_${file.name}`;
                
                // Upload to Supabase Storage
                const { data: uploadData, error: uploadError } = await supabase.storage
                    .from('breakdown-media')
                    .upload(filePath, file);

                if (uploadError) {
                    showError("Upload failed: " + uploadError.message);
                    return;
                }

                // Get public URL
                const { data: urlData } = supabase.storage
                    .from('breakdown-media')
                    .getPublicUrl(filePath);
                
                fileUrl = urlData.publicUrl;
            }

            // Insert into Database
            const { error: dbError } = await supabase
                .from('apartment_assets')
                .insert([{
                    technician: currentUserEmail,
                    apartment_name: aptName,
                    category: category,
                    title: file ? file.name : 'No File',
                    media_urls: fileUrl ? [fileUrl] : []
                }]);

            if (dbError) {
                showError("Database error: " + dbError.message);
            } else {
                showSuccess("Asset uploaded successfully!");
                document.getElementById('apt-name-input').value = '';
                fileInput.value = '';
                fetchAssets(); // Refresh list
            }
        }

        // 6. Search Function
        function searchAssets() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const items = document.getElementById('assets-list').children;
            
            for (let i = 0; i < items.length; i++) {
                const text = items[i].innerText.toLowerCase();
                items[i].style.display = text.includes(query) ? '' : 'none';
            }
        }

        // 7. UI Helpers
        function showError(msg) {
            const el = document.getElementById('error-msg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-msg');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 5000);
        }
        
        function selectCategory(cat) {
            if (cat === 'apartments') {
                // Just scroll to search
                document.getElementById('search-input').focus();
            } else {
                document.getElementById('category-input').value = cat;
                document.getElementById('apt-name-input').focus();
            }
        }
    </script>
</body>
</html>
